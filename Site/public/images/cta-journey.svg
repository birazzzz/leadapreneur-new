      <stop offset="0.42" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#56D8E5"/>
    </linearGradient>
    <linearGradient id="beam" x1="542" y1="371" x2="879" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#03AFBC" stop-opacity="0.76"/>
      <stop offset="0.75" stop-color="#ACFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F2FFFF" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="peakLight" x1="1477" y1="309" x2="1438" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1FFFF"/>
      <stop offset="1" stop-color="#19D9E2"/>
