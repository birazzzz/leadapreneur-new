<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="952" viewBox="0 0 1672 952" fill="none">
  <title>AI journey through a low-poly mountain landscape</title>
  <desc>Pure vector illustration of a glowing portal, lighthouse, winding route, mountain summit, and AI flag in cyan and deep teal.</desc>
  <defs>
    <linearGradient id="water" x1="836" y1="622" x2="836" y2="874" gradientUnits="userSpaceOnUse">
      <stop stop-color="#087993"/>
      <stop offset="0.45" stop-color="#0AB6C7"/>
      <stop offset="1" stop-color="#20DDE4"/>
    </linearGradient>
    <linearGradient id="foreground" x1="260" y1="731" x2="1270" y2="883" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1FE4E8"/>
      <stop offset="0.5" stop-color="#0B9DB7"/>
      <stop offset="1" stop-color="#04758E"/>
    </linearGradient>
    <linearGradient id="portalShell" x1="264" y1="472" x2="264" y2="723" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4FFFF"/>
      <stop offset="0.18" stop-color="#65F8F5"/>
      <stop offset="0.56" stop-color="#00AFC7"/>
