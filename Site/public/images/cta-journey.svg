      <stop offset="0.32" stop-color="#78FFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00E3ED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="36%" cy="26%" r="72%">
